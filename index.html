<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jason Trevor Simon | Systems, Robotics & Aerospace Portfolio</title>
  <meta name="description" content="Professional portfolio of Jason Trevor Simon, Mechanical Engineering student at the University of Pennsylvania. Specializing in AI, robotics, aerospace, and entrepreneurship.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ==========================================
       Navigation Header
       ========================================== -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="logo-container" id="nav-logo">
        <div class="logo">JASON SIMON<span class="logo-dot"></span></div>
        <div class="logo-subtitle">Intern @ Shield AI | Prev. @ SpaceX, NASA, Boeing | MS + BSE @ UPENN</div>
      </a>
      <nav class="nav-links">
        <a href="#hero" class="active">Home</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- ==========================================
       Hero Section
       ========================================== -->
  <section id="hero" class="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-content">
      <div class="hero-grid">
        
        <!-- Left Side: Copy and Details -->
        <div class="hero-left">
          <!-- Tagline removed as requested -->
          <h1 class="hero-title" id="hero-title">
            <!-- Dyn. Populated -->
          </h1>
          <div class="hero-desc-container" id="hero-desc">
            <!-- Dyn. Populated -->
          </div>
          
          <!-- Academic Credentials Target -->
          <div class="hero-stats" id="hero-stats">
            <!-- Dyn. Populated -->
          </div>

          <!-- Contact Information Strip Target -->
          <div class="hero-contact-strip" id="hero-contact-strip">
            <!-- Dyn. Populated -->
          </div>

          <div class="hero-buttons">
            <a href="#experience" class="btn btn-primary">
              Explore Experiences
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3" />
              </svg>
            </a>
            <a href="#projects" class="btn btn-primary">
              Explore Projects
              <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3" />
              </svg>
            </a>
            <a href="#contact" class="btn btn-secondary">Get in Touch</a>
          </div>
        </div>

        <!-- Right Side: Graphic scanner frame (Profile/BB-8 image) -->
        <div class="hero-right">
          <div class="hero-scanner-frame">
            <div class="scanner-bar"></div>
            
            <!-- PROFILE IMAGE (Active) -->
            <img src="images/Personal image 1.png" alt="Jason Simon" class="hero-scanner-img">
            
            <!-- BB-8 IMAGE (Uncomment below and comment out profile image above to switch back) -->
            <!-- <img src="images/BB8 image 1.jpeg" alt="BB-8 Droid Project Model" class="hero-scanner-img"> -->
            
            <div class="scanner-corner tl"></div>
            <div class="scanner-corner tr"></div>
            <div class="scanner-corner bl"></div>
            <div class="scanner-corner br"></div>
            
            <!-- Scanner Tags -->
            <div class="scanner-tag">TARGET_USER: ACQUISITION_OK</div>
            <!-- <div class="scanner-tag">TARGET_BB8: ACQUISITION_OK</div> -->
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- ==========================================
       Professional Experience Section
       ========================================== -->
  <section id="experience" class="container">
    <h2 class="section-title">Professional Experience</h2>
    
    <!-- Experience Timeline Target -->
    <div class="timeline-wrapper" id="experience-timeline">
      <!-- Dyn. Populated -->
    </div>
  </section>

  <!-- ==========================================
       Featured Projects Section
       ========================================== -->
  <section id="projects" class="container">
    <h2 class="section-title">Featured Projects</h2>
    
    <!-- Projects Grid Target -->
    <div class="projects-grid" id="projects-grid">
      <!-- Dyn. Populated -->
    </div>
  </section>

  <!-- ==========================================
       Footer & Contact Section
       ========================================== -->
  <footer id="contact" class="footer">
    <div class="container" style="padding: 0 0 40px 0;">
      <div class="footer-grid">
        
        <!-- Info Column Target -->
        <div class="footer-info-col" id="footer-info-col">
          <!-- Dyn. Populated -->
        </div>

        <!-- Contact Form Column: FormSubmit Integration -->
        <div>
          <form class="contact-form" action="https://formsubmit.co/jasonsimon343@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="New Portfolio Message!">
            <input type="hidden" name="_captcha" value="false">
            
            <div class="form-group">
              <label for="form-name">Name</label>
              <input type="text" id="form-name" name="name" class="form-input" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <label for="form-email">Email</label>
              <input type="email" id="form-email" name="email" class="form-input" placeholder="your.email@domain.com" required>
            </div>
            <div class="form-group">
              <label for="form-msg">Message</label>
              <textarea id="form-msg" name="message" class="form-input" rows="4" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: max-content; align-self: flex-start;">Send Message</button>
          </form>
        </div>

      </div>

      <!-- Bottom bar -->
      <div class="footer-bottom">
        <div class="copyright" id="footer-copyright">
          <!-- Dyn. Populated -->
        </div>
        <div class="social-links" id="footer-socials">
          <!-- Dyn. Populated -->
        </div>
      </div>
    </div>
  </footer>

  <!-- Floating Coding Animation Widget in Bottom Corner -->
  <div class="telemetry-widget">
    <canvas id="telemetry-radar" width="100" height="100"></canvas>
  </div>

  <!-- Container for Auto-Generated Modals -->
  <div id="modals-container"></div>

  <!-- Load Configuration File first, then Interactive logic -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
